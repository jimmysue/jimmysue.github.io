<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="920" height="460" rx="14" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">线性注意力：一次「换括号」把 O(L²) 变成 O(L)</text>

  <!-- ============ TOP: expensive path ============ -->
  <text x="40" y="78" font-size="15" font-weight="700" fill="#cf222e">✗ 老顺序 (QKᵀ)V —— 先造出 L×L 大矩阵</text>

  <!-- Q -->
  <rect x="48" y="96" width="46" height="78" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="71" y="140" text-anchor="middle" font-size="14" fill="#1e40af">Q</text>
  <text x="71" y="188" text-anchor="middle" font-size="11" fill="#57606a">L×d</text>
  <text x="108" y="140" font-size="16" fill="#57606a">×</text>
  <!-- Kt -->
  <rect x="124" y="112" width="78" height="46" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="163" y="140" text-anchor="middle" font-size="14" fill="#1e40af">Kᵀ</text>
  <text x="163" y="150" text-anchor="middle" font-size="0" fill="#57606a"></text>
  <text x="163" y="172" text-anchor="middle" font-size="11" fill="#57606a">d×L</text>
  <text x="214" y="140" font-size="16" fill="#57606a">→</text>

  <!-- big LxL -->
  <rect x="238" y="92" width="110" height="110" rx="4" fill="#ffe3e3" stroke="#cf222e" stroke-width="2"/>
  <text x="293" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#cf222e">L×L</text>
  <text x="293" y="160" text-anchor="middle" font-size="11" fill="#cf222e">≈ 1 亿个数</text>
  <text x="293" y="220" text-anchor="middle" font-size="11" fill="#57606a">(爆炸点)</text>
  <text x="360" y="150" font-size="16" fill="#57606a">×</text>

  <!-- V -->
  <rect x="378" y="112" width="46" height="78" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="401" y="156" text-anchor="middle" font-size="14" fill="#1e40af">V</text>
  <text x="401" y="204" text-anchor="middle" font-size="11" fill="#57606a">L×d</text>
  <text x="438" y="150" font-size="16" fill="#57606a">=</text>

  <!-- out -->
  <rect x="462" y="112" width="46" height="78" rx="4" fill="#eef2f5" stroke="#8c959f"/>
  <text x="485" y="156" text-anchor="middle" font-size="13" fill="#57606a">O</text>
  <text x="485" y="204" text-anchor="middle" font-size="11" fill="#57606a">L×d</text>

  <text x="560" y="150" font-size="13" fill="#cf222e" font-weight="700">代价 O(L²·d)</text>

  <line x1="40" y1="248" x2="880" y2="248" stroke="#d0d7de" stroke-dasharray="4 4"/>

  <!-- ============ BOTTOM: cheap path ============ -->
  <text x="40" y="290" font-size="15" font-weight="700" fill="#1a7f37">✓ 新顺序 Q(KᵀV) —— 先把 key 侧熬成小摘要 C</text>

  <!-- Kt -->
  <rect x="48" y="316" width="78" height="46" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="87" y="344" text-anchor="middle" font-size="14" fill="#1e40af">Kᵀ</text>
  <text x="87" y="378" text-anchor="middle" font-size="11" fill="#57606a">d×L</text>
  <text x="134" y="344" font-size="16" fill="#57606a">×</text>
  <!-- V -->
  <rect x="152" y="308" width="46" height="62" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="175" y="344" text-anchor="middle" font-size="14" fill="#1e40af">V</text>
  <text x="175" y="384" text-anchor="middle" font-size="11" fill="#57606a">L×d</text>
  <text x="210" y="344" font-size="16" fill="#57606a">→</text>

  <!-- C small -->
  <rect x="236" y="320" width="52" height="52" rx="4" fill="#d3f9d8" stroke="#1a7f37" stroke-width="2"/>
  <text x="262" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">C</text>
  <text x="262" y="360" text-anchor="middle" font-size="11" fill="#1a7f37">d×d</text>
  <text x="262" y="398" text-anchor="middle" font-size="10.5" fill="#1a7f37">全局摘要·4096个数</text>

  <text x="300" y="344" font-size="12" fill="#57606a" font-style="italic">算一次</text>
  <text x="300" y="360" font-size="12" fill="#57606a" font-style="italic">所有 Q 共用</text>

  <text x="392" y="344" font-size="16" fill="#57606a">Q</text>
  <rect x="410" y="316" width="46" height="62" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="433" y="352" text-anchor="middle" font-size="14" fill="#1e40af">Q</text>
  <text x="466" y="344" font-size="16" fill="#57606a">×</text>
  <rect x="484" y="320" width="52" height="52" rx="4" fill="#d3f9d8" stroke="#1a7f37"/>
  <text x="510" y="350" text-anchor="middle" font-size="14" fill="#1a7f37">C</text>
  <text x="548" y="344" font-size="16" fill="#57606a">=</text>
  <rect x="572" y="316" width="46" height="62" rx="4" fill="#eef2f5" stroke="#8c959f"/>
  <text x="595" y="352" text-anchor="middle" font-size="13" fill="#57606a">O</text>

  <text x="660" y="344" font-size="13" fill="#1a7f37" font-weight="700">代价 O(L·d²)</text>
  <text x="660" y="364" font-size="11" fill="#57606a">L 翻倍只翻倍，不翻 4 倍</text>

  <text x="460" y="440" text-anchor="middle" font-size="12.5" fill="#57606a">同一个乘法，结合律换个算的顺序——从不构造 L×L，就是补偿分支便宜的全部秘密</text>
</svg>
