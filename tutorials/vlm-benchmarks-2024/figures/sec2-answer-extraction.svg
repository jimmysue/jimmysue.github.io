<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="920" height="360" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="460" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">多选题的真正难点:从自由文本里「抠出」选项</text>

  <!-- model output -->
  <rect x="40" y="74" width="250" height="120" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="56" y="98" font-size="13" font-weight="700" fill="#6b7280">模型原始输出</text>
  <text x="56" y="124" font-size="12.5" fill="#374151">“我认为应该选 B,</text>
  <text x="56" y="144" font-size="12.5" fill="#374151">因为图里那只动物</text>
  <text x="56" y="164" font-size="12.5" fill="#374151">有长长的耳朵……”</text>

  <!-- arrow -->
  <line x1="298" y1="134" x2="350" y2="134" stroke="#fa541c" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- extractor -->
  <rect x="356" y="74" width="220" height="120" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="466" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">答案提取器</text>
  <text x="466" y="126" text-anchor="middle" font-size="12" fill="#374151">① 去掉「答案是」前缀</text>
  <text x="466" y="148" text-anchor="middle" font-size="12" fill="#374151">② 正则找 [ABCDE]</text>
  <text x="466" y="170" text-anchor="middle" font-size="12" fill="#374151">③ 兜底:LLM 裁判</text>

  <line x1="584" y1="134" x2="636" y2="134" stroke="#fa541c" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- extracted -->
  <rect x="642" y="98" width="100" height="72" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="692" y="142" text-anchor="middle" font-size="30" font-weight="800" fill="#1d4ed8">B</text>

  <!-- compare -->
  <line x1="692" y1="176" x2="692" y2="214" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>
  <rect x="612" y="220" width="160" height="60" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="692" y="244" text-anchor="middle" font-size="12.5" fill="#374151">与标准答案对比</text>
  <text x="692" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">命中 hit = 1</text>

  <!-- note -->
  <rect x="40" y="220" width="540" height="100" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="60" y="246" font-size="13.5" font-weight="700" fill="#b91c1c">为什么这是误差源</text>
  <text x="60" y="270" font-size="12.5" fill="#374151">· 模型答「应该是 B 或 C」→ 提取器只能取第一个,可能误判</text>
  <text x="60" y="291" font-size="12.5" fill="#374151">· 不同 harness 提取规则不同 → 同一模型分数能差几个点</text>
  <text x="60" y="312" font-size="12.5" fill="#374151">· CircularEval:把选项轮转 N 次,N 次全对才算对(更难蒙)</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#fa541c"/>
    </marker>
  </defs>
</svg>
