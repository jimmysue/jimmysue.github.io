<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="grad6input" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#93c5fd"/></linearGradient>
    <linearGradient id="grad6align" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="grad6dec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbcfe8"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  </defs>

  <!-- Title -->
  <text x="550" y="35" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">让 VLM 看清细节的三层栈</text>
  <text x="550" y="58" font-size="13" fill="#64748b" text-anchor="middle">分辨率 (输入) + 注意力对齐 (中段) + 解码增强 (输出)</text>

  <!-- Stack visualization: 3 horizontal bands -->

  <!-- INPUT layer (bottom) - blue -->
  <g>
    <rect x="60" y="380" width="980" height="110" rx="14" fill="url(#grad6input)" stroke="#1e40af" stroke-width="2"/>
    <text x="100" y="412" font-size="16" font-weight="700" fill="#1e3a8a">① 输入分辨率层</text>
    <text x="100" y="432" font-size="12" fill="#1e3a8a" font-style="italic">问题: 224×224 把 1024×1024 缺陷糊掉</text>

    <!-- Three sub-strategies -->
    <g>
      <rect x="290" y="395" width="220" height="85" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="400" y="416" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">Multi-scale 窗口</text>
      <text x="400" y="432" font-size="10" fill="#475569" text-anchor="middle">WinCLIP: 3 scales</text>
      <text x="400" y="447" font-size="10" fill="#475569" text-anchor="middle">{16,32,64} px window</text>
      <text x="400" y="462" font-size="10" fill="#475569" text-anchor="middle">每窗口独立 CLIP encode</text>
      <text x="400" y="476" font-size="9.5" fill="#1e40af" text-anchor="middle">⚙ §2</text>
    </g>

    <g>
      <rect x="530" y="395" width="220" height="85" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="640" y="416" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">AnyRes / Tile</text>
      <text x="640" y="432" font-size="10" fill="#475569" text-anchor="middle">LLaVA-1.6 风格</text>
      <text x="640" y="447" font-size="10" fill="#475569" text-anchor="middle">高分图切 N tile</text>
      <text x="640" y="462" font-size="10" fill="#475569" text-anchor="middle">concat 后喂 LLM</text>
      <text x="640" y="476" font-size="9.5" fill="#1e40af" text-anchor="middle">⚙ AnomalyGPT 风格</text>
    </g>

    <g>
      <rect x="770" y="395" width="220" height="85" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="880" y="416" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">SAM-assisted Crop</text>
      <text x="880" y="432" font-size="10" fill="#475569" text-anchor="middle">SAM 出物体 mask</text>
      <text x="880" y="447" font-size="10" fill="#475569" text-anchor="middle">crop 出主体放大</text>
      <text x="880" y="462" font-size="10" fill="#475569" text-anchor="middle">再喂 VLM</text>
      <text x="880" y="476" font-size="9.5" fill="#1e40af" text-anchor="middle">⚙ 现代 pipeline</text>
    </g>
  </g>

  <!-- ALIGNMENT layer (middle) - amber -->
  <g>
    <rect x="60" y="240" width="980" height="110" rx="14" fill="url(#grad6align)" stroke="#92400e" stroke-width="2"/>
    <text x="100" y="272" font-size="16" font-weight="700" fill="#78350f">② 特征对齐层</text>
    <text x="100" y="292" font-size="12" fill="#78350f" font-style="italic">问题: CLIP attention 看全局, 缺陷 attention 信号被稀释</text>

    <g>
      <rect x="290" y="255" width="345" height="85" rx="8" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
      <text x="462" y="276" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">Patch-level alignment (WinCLIP)</text>
      <text x="462" y="294" font-size="10" fill="#475569" text-anchor="middle">cosine(F_patch, F_prompt) 替代 global pooling</text>
      <text x="462" y="310" font-size="10" fill="#475569" text-anchor="middle">每个 patch 都有 anomaly score</text>
      <text x="462" y="326" font-size="9.5" fill="#92400e" text-anchor="middle">⚙ §2.3 公式 (3)</text>
    </g>

    <g>
      <rect x="655" y="255" width="335" height="85" rx="8" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
      <text x="822" y="276" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">DPAM: V-V attention (AnomalyCLIP)</text>
      <text x="822" y="294" font-size="10" fill="#475569" text-anchor="middle">softmax(VV^T/√d) V 替代 softmax(QK^T/√d) V</text>
      <text x="822" y="310" font-size="10" fill="#475569" text-anchor="middle">让 attention 关注局部 patch (不是 routing weights)</text>
      <text x="822" y="326" font-size="9.5" fill="#92400e" text-anchor="middle">⚙ §3.3 公式 (2)</text>
    </g>
  </g>

  <!-- DECODER layer (top) - pink -->
  <g>
    <rect x="60" y="100" width="980" height="110" rx="14" fill="url(#grad6dec)" stroke="#9f1239" stroke-width="2"/>
    <text x="100" y="132" font-size="16" font-weight="700" fill="#831843">③ 解码增强层</text>
    <text x="100" y="152" font-size="12" fill="#831843" font-style="italic">问题: LLM 给文本概率, 不会输出像素级 mask</text>

    <g>
      <rect x="290" y="115" width="345" height="85" rx="8" fill="#fff" stroke="#be185d" stroke-width="1.5"/>
      <text x="462" y="136" font-size="12" font-weight="600" fill="#9f1239" text-anchor="middle">Multi-layer linear decoder</text>
      <text x="462" y="154" font-size="10" fill="#475569" text-anchor="middle">k 层 ViT 特征 → 各自 W_l 投影 → upsample</text>
      <text x="462" y="170" font-size="10" fill="#475569" text-anchor="middle">轻量, 不动 backbone, 可端到端训</text>
      <text x="462" y="186" font-size="9.5" fill="#9f1239" text-anchor="middle">⚙ AnomalyGPT LinearLayer · §4.3 公式 (2)</text>
    </g>

    <g>
      <rect x="655" y="115" width="335" height="85" rx="8" fill="#fff" stroke="#be185d" stroke-width="1.5"/>
      <text x="822" y="136" font-size="12" font-weight="600" fill="#9f1239" text-anchor="middle">SAM zoom-in 后处理</text>
      <text x="822" y="154" font-size="10" fill="#475569" text-anchor="middle">VLM 给粗位置 (9-region) → SAM 精修</text>
      <text x="822" y="170" font-size="10" fill="#475569" text-anchor="middle">最终 mask 像素级</text>
      <text x="822" y="186" font-size="9.5" fill="#9f1239" text-anchor="middle">⚙ 现代 pipeline 标配</text>
    </g>
  </g>

  <!-- Vertical flow arrows on left -->
  <line x1="40" y1="490" x2="40" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#arr6)"/>
  <text x="20" y="295" font-size="11" fill="#64748b" transform="rotate(-90 20 295)">数据流</text>

  <!-- Stack-up effect labels on right -->
  <text x="1060" y="445" font-size="11" font-weight="600" fill="#1e40af" transform="rotate(-90 1060 445)">输入</text>
  <text x="1060" y="305" font-size="11" font-weight="600" fill="#92400e" transform="rotate(-90 1060 305)">中段</text>
  <text x="1060" y="165" font-size="11" font-weight="600" fill="#9f1239" transform="rotate(-90 1060 165)">输出</text>

  <!-- Bottom note -->
  <text x="550" y="525" font-size="11" fill="#475569" text-anchor="middle" font-style="italic">SOTA 系统通常把三层组合: 多尺度 tile (①) + DPAM (②) + 多层 decoder (③)</text>
</svg>
