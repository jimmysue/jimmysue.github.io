<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="grad5a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="grad5b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="grad5c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="grad5d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3e8ff"/><stop offset="1" stop-color="#e9d5ff"/></linearGradient>
    <linearGradient id="grad5e" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe4e6"/><stop offset="1" stop-color="#fecdd3"/></linearGradient>
  </defs>

  <!-- Title -->
  <text x="600" y="40" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">工业检测数据制作的演进 (2021 → 2026)</text>
  <text x="600" y="64" font-size="13" fill="#64748b" text-anchor="middle">从手动 cut-paste 到 VLM-in-the-loop 闭环标注 + 百万级开放词汇数据集</text>

  <!-- Timeline axis -->
  <line x1="80" y1="280" x2="1120" y2="280" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="80" y1="280" x2="1120" y2="280" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Year ticks -->
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <line x1="160" y1="275" x2="160" y2="285" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="160" y="305">2021</text>
    <line x1="370" y1="275" x2="370" y2="285" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="370" y="305">2023</text>
    <line x1="580" y1="275" x2="580" y2="285" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="580" y="305">2024</text>
    <line x1="790" y1="275" x2="790" y2="285" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="790" y="305">2025</text>
    <line x1="1000" y1="275" x2="1000" y2="285" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1000" y="305">2026</text>
  </g>

  <!-- Stage 1: CutPaste -->
  <g>
    <rect x="100" y="120" width="160" height="120" rx="10" fill="url(#grad5a)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="180" y="148" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">CutPaste</text>
    <text x="180" y="168" font-size="11" fill="#1e40af" text-anchor="middle">(Li et al. 2021)</text>
    <!-- Icon: rect overlay -->
    <rect x="125" y="180" width="50" height="35" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
    <rect x="142" y="190" width="18" height="14" fill="#3b82f6" opacity="0.7"/>
    <text x="220" y="200" font-size="10.5" fill="#0f172a">随机矩形 cut</text>
    <text x="220" y="215" font-size="10.5" fill="#0f172a">paste 到原图</text>
    <text x="180" y="232" font-size="10" fill="#1e40af" text-anchor="middle">label: binary</text>
    <line x1="180" y1="240" x2="180" y2="275" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr5)"/>
    <circle cx="180" cy="280" r="5" fill="#3b82f6"/>
  </g>

  <!-- Stage 2: DRAEM -->
  <g>
    <rect x="280" y="120" width="160" height="120" rx="10" fill="url(#grad5b)" stroke="#d97706" stroke-width="1.5"/>
    <text x="360" y="148" font-size="14" font-weight="600" fill="#7c2d12" text-anchor="middle">DRAEM</text>
    <text x="360" y="168" font-size="11" fill="#9a3412" text-anchor="middle">(Zavrtanik et al. 2021)</text>
    <!-- Icon: perlin texture -->
    <rect x="305" y="180" width="50" height="35" fill="#fff" stroke="#d97706" stroke-width="1"/>
    <path d="M 305 197 q 12 -8 25 0 t 25 0" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.8"/>
    <path d="M 305 207 q 8 -6 18 2 t 22 0 q 5 -2 10 -1" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.6"/>
    <text x="400" y="200" font-size="10.5" fill="#0f172a">Perlin noise mask</text>
    <text x="400" y="215" font-size="10.5" fill="#0f172a">+ 外部自然图</text>
    <text x="360" y="232" font-size="10" fill="#9a3412" text-anchor="middle">label: mask + 重建</text>
    <line x1="360" y1="240" x2="370" y2="275" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr5)"/>
    <circle cx="370" cy="280" r="5" fill="#d97706"/>
  </g>

  <!-- Stage 3: AnomalyGPT (centered, biggest = breakthrough) -->
  <g>
    <rect x="475" y="100" width="200" height="155" rx="10" fill="url(#grad5c)" stroke="#15803d" stroke-width="2"/>
    <text x="575" y="125" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">AnomalyGPT</text>
    <text x="575" y="143" font-size="11" fill="#166534" text-anchor="middle">(Gu et al. AAAI'24)</text>
    <!-- Icon: image + text dialogue -->
    <rect x="495" y="155" width="44" height="32" fill="#fff" stroke="#15803d" stroke-width="1"/>
    <ellipse cx="517" cy="171" rx="8" ry="5" fill="#15803d" opacity="0.5"/>
    <path d="M 552 158 h 80 q 5 0 5 5 v 18 q 0 5 -5 5 h -75 l -5 6 z" fill="#fff" stroke="#15803d" stroke-width="1"/>
    <text x="592" y="173" font-size="9" fill="#14532d" text-anchor="middle">"左下有划痕"</text>
    <text x="495" y="207" font-size="10.5" fill="#0f172a">mask 引导 paste</text>
    <text x="495" y="222" font-size="10.5" fill="#0f172a">+ 自动 9-区域</text>
    <text x="495" y="237" font-size="10.5" fill="#0f172a">文字 caption</text>
    <text x="575" y="252" font-size="10" font-weight="600" fill="#14532d" text-anchor="middle">label: mask + text + 对话</text>
    <line x1="575" y1="255" x2="580" y2="275" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr5)"/>
    <circle cx="580" cy="280" r="6" fill="#15803d"/>
  </g>

  <!-- Stage 4: IMDD-1M -->
  <g>
    <rect x="695" y="120" width="160" height="120" rx="10" fill="url(#grad5d)" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="775" y="148" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">IMDD-1M</text>
    <text x="775" y="168" font-size="11" fill="#5b21b6" text-anchor="middle">(Ni et al. 2025)</text>
    <!-- Icon: scale bars -->
    <g>
      <rect x="715" y="183" width="6" height="30" fill="#7c3aed" opacity="0.4"/>
      <rect x="724" y="178" width="6" height="35" fill="#7c3aed" opacity="0.6"/>
      <rect x="733" y="175" width="6" height="38" fill="#7c3aed" opacity="0.8"/>
      <rect x="742" y="172" width="6" height="41" fill="#7c3aed"/>
    </g>
    <text x="800" y="190" font-size="10.5" fill="#0f172a">1M 图文对</text>
    <text x="800" y="203" font-size="10.5" fill="#0f172a">400+ 缺陷类型</text>
    <text x="800" y="216" font-size="10.5" fill="#0f172a">60+ 材料类</text>
    <text x="775" y="232" font-size="10" fill="#5b21b6" text-anchor="middle">open-vocabulary 基础模型</text>
    <line x1="775" y1="240" x2="780" y2="275" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr5)"/>
    <circle cx="785" cy="280" r="5" fill="#7c3aed"/>
  </g>

  <!-- Stage 5: AD-Copilot Chat-AD -->
  <g>
    <rect x="905" y="120" width="190" height="120" rx="10" fill="url(#grad5e)" stroke="#be123c" stroke-width="1.5"/>
    <text x="1000" y="148" font-size="14" font-weight="600" fill="#881337" text-anchor="middle">AD-Copilot / Chat-AD</text>
    <text x="1000" y="168" font-size="11" fill="#9f1239" text-anchor="middle">(2026 preprint)</text>
    <!-- Icon: closed loop -->
    <circle cx="935" cy="200" r="18" fill="none" stroke="#be123c" stroke-width="1.5"/>
    <path d="M 920 192 q 0 -10 15 -10 q 15 0 15 10" fill="none" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr5)"/>
    <text x="970" y="195" font-size="10.5" fill="#0f172a">VLM 当标注员</text>
    <text x="970" y="208" font-size="10.5" fill="#0f172a">in-context 对照</text>
    <text x="970" y="221" font-size="10.5" fill="#0f172a">闭环 fine-tune</text>
    <text x="1000" y="237" font-size="10" fill="#881337" text-anchor="middle">label: CoT + 多轮对话</text>
    <line x1="1000" y1="240" x2="1000" y2="275" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr5)"/>
    <circle cx="1000" cy="280" r="5" fill="#be123c"/>
  </g>

  <!-- Bottom labels: data scale + label richness -->
  <text x="80" y="380" font-size="12" font-weight="600" fill="#0f172a">数据规模 (#样本):</text>
  <g font-size="11" fill="#475569">
    <text x="180" y="380">~10³</text>
    <text x="370" y="380">~10³</text>
    <text x="575" y="380">~10⁴</text>
    <text x="775" y="380">10⁶</text>
    <text x="1000" y="380">~10⁵+</text>
  </g>
  <text x="80" y="408" font-size="12" font-weight="600" fill="#0f172a">标签丰富度:</text>
  <g font-size="11" fill="#475569">
    <text x="180" y="408">binary</text>
    <text x="370" y="408">mask</text>
    <text x="575" y="408" font-weight="600" fill="#15803d">mask + text</text>
    <text x="775" y="408">mask + text + 类别</text>
    <text x="1000" y="408">CoT + 对话</text>
  </g>
  <text x="80" y="436" font-size="12" font-weight="600" fill="#0f172a">合成手段:</text>
  <g font-size="11" fill="#475569">
    <text x="180" y="436">随机 rect</text>
    <text x="370" y="436">Perlin</text>
    <text x="575" y="436">mask+Poisson 融合</text>
    <text x="775" y="436">真实图扩展</text>
    <text x="1000" y="436">VLM-in-loop</text>
  </g>
</svg>
