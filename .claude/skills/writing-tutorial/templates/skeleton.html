    window.MathJax = {
      tex: {
        inlineMath: [['$','$'], ['\\(','\\)']],
        displayMath: [['$$','$$'], ['\\[','\\]']],
        processEscapes: true

          src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <script>document.addEventListener('DOMContentLoaded', () => hljs.highlightAll());</script>
</head>
<body class="tutorial-page">

      <div><strong>主要资料</strong> {{KEY_SOURCES_INLINE}}</div>
    </div>
  </header>

  <!-- Optional: provenance warning if Phase 2 found weak sources. Omit entirely otherwise. -->
  {{PROVENANCE_WARNING_BLOCK}}

  <!-- Optional: lede / 导读 paragraph before §1 -->
  <section id="sec-0" class="lede">
    <p>{{LEDE}}</p>
  </section>

  <!-- INSERT-SECTIONS-HERE -->
  <!-- Each section produced by Phase 5 drafter goes here, in order.
       Format: <section id="sec-N">...spiral 5 sub-steps...</section>
       Templates: see templates/spiral-section.html
  -->

  <section id="references" class="references">
    <h2 id="sec-refs">References</h2>
    <h3 id="sec-refs-papers">论文 / Papers</h3>

      <!-- INSERT-PAPER-REFS-HERE -->

  <footer class="paper-footer">

    <p><a href="../../index.html">← 返回首页</a></p>
  </footer>

</main>

<!-- IntersectionObserver: highlight active TOC entry and auto-scroll the TOC.
     Same pattern as reading-papers; lives inline so each tutorial is self-contained. -->
<script>
(function() {
  const toc = document.querySelector('.toc');
  if (!toc) return;
  const links = Array.from(toc.querySelectorAll('a[href^="#"]'));
  const targets = links
    .map(a => document.getElementById(a.getAttribute('href').slice(1)))
    .filter(Boolean);

  function setActive(id) {
    links.forEach(a => {
      const on = a.getAttribute('href') === '#' + id;
      a.classList.toggle('active', on);
      if (on) {
        const r = a.getBoundingClientRect();
        const tr = toc.getBoundingClientRect();
        if (r.top < tr.top + 40 || r.bottom > tr.bottom - 40) {
          a.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
      }
    });
  }

  const obs = new IntersectionObserver((entries) => {
    const visible = entries
      .filter(e => e.isIntersecting)
      .sort((a, b) => a.target.offsetTop - b.target.offsetTop);
    if (visible.length) setActive(visible[0].target.id);
  }, { rootMargin: '-30% 0px -55% 0px', threshold: 0 });

  targets.forEach(t => obs.observe(t));
})();
</script>

</body>
</html>
