stillation", "weight": 1}, {"source": "concepts/video", "target": "concepts/wan2", "weight": 1}, {"source": "concepts/video", "target": "concepts/world-model", "weight": 2}, {"source": "concepts/video-generation", "target": "concepts/vlm", "weight": 1}, {"source": "concepts/video-generation", "target": "concepts/world-model", "weight": 2}, {"source": "concepts/vision-encoder", "target": "concepts/vlm", "weight": 1}, {"source": "concepts/vlm", "target": "concepts/world-model", "weight": 1}, {"source": "concepts/wan2", "target": "concepts/world-model", "weight": 1}, {"source": "concepts/wavelet-diffusion", "target": "concepts/window-attention", "weight": 1}]};

<script>
(function () {
  const G = window.__CONCEPT_GRAPH__;
  const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  function palette() {
    return {
      accent: cssVar('--accent') || '#d4380d',
      text: cssVar('--text') || '#222',
      sub: cssVar('--text-secondary') || '#666',
      border: cssVar('--border') || '#d9d9d9',
      rule: cssVar('--rule') || '#f0f0f0',
    };
  }

  const elements = [
    ...G.nodes.map(n => ({
      data: {
        id: n.id, label: n.name, raw: n,
        size: 16 + Math.min(36, (n.mentions || 0) * 4),
        big: (n.mentions || 0) >= 3 ? 1 : 0,
      },
    })),
    ...G.edges.map((e, i) => ({
      data: {
        id: 'e' + i, source: e.source, target: e.target, weight: e.weight || 1,
        w: 1 + Math.min(6, (e.weight || 1)),
        op: 0.22 + Math.min(0.6, (e.weight || 1) * 0.12),
      },
    })),
  ];

  function nodeStyle() {
    const p = palette();
    return [
      { selector: 'node', style: {
        'background-color': p.accent,
        'background-opacity': 0.9,
        'label': 'data(label)',
        'color': p.text,
        'font-size': '11px',
        'text-valign': 'bottom', 'text-margin-y': 4,
        'text-wrap': 'ellipsis', 'text-max-width': 150,
        'text-opacity': 'data(big)',
        'width': 'data(size)', 'height': 'data(size)',
        'border-width': 1, 'border-color': p.border,
      } },
      { selector: 'node:selected', style: {
        'border-width': 3, 'border-color': p.accent, 'text-opacity': 1,
      } },
      { selector: 'node.hl', style: { 'text-opacity': 1, 'border-width': 3, 'border-color': p.accent } },
      { selector: 'node.dim', style: { 'opacity': 0.18 } },
      { selector: 'edge', style: {
        'width': 'data(w)',
        'line-color': p.sub,
        'opacity': 'data(op)',
        'curve-style': 'bezier',
      } },
      { selector: 'edge.dim', style: { 'opacity': 0.05 } },
    ];
  }

  const cy = cytoscape({
    container: document.getElementById('cy'),
    elements,
    layout: { name: 'cose-bilkent', nodeRepulsion: 9000, idealEdgeLength: 110, animate: false },
    style: nodeStyle(),
    wheelSensitivity: 0.2,
  });

  // --- theme re-style on <html data-theme> change ---
  new MutationObserver(() => cy.style(nodeStyle())).observe(
    document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // --- min-weight slider ---
  const slider = document.getElementById('weight-slider');
  const wval = document.getElementById('weight-val');
  function applyWeight() {
    const t = parseInt(slider.value, 10);
    wval.textContent = t;
    cy.edges().forEach(e => {
      if (e.data('weight') >= t) e.removeClass('dim'); else e.addClass('dim');
    });
  }
  slider.addEventListener('input', applyWeight);

  // --- tooltip ---
  const tip = document.getElementById('graph-tooltip');
  const shell = document.querySelector('.graph-body');
  cy.on('mouseover', 'node', evt => {
    const d = evt.target.data('raw');
    tip.innerHTML = '<strong>' + esc(d.name) + '</strong><br>' + d.mentions + ' 篇提及';
    tip.style.display = 'block';
  });
  cy.on('mousemove', 'node', evt => {
    const r = shell.getBoundingClientRect();
    tip.style.left = (evt.originalEvent.clientX - r.left + 12) + 'px';
    tip.style.top = (evt.originalEvent.clientY - r.top + 12) + 'px';
  });
  cy.on('mouseout', 'node', () => { tip.style.display = 'none'; });

  // --- detail panel ---
  const panel = document.getElementById('concept-panel');
  const pTitle = document.getElementById('panel-title');
  const pBody = document.getElementById('panel-body');
  const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function openPanel(d) {
    pTitle.textContent = d.name;
    let html = '';
    if (d.noteSummary) html += '<p class="concept-panel__note">' + esc(d.noteSummary) + '</p>';
    const papers = d.docs.filter(x => x.type === 'paper');
    const tuts = d.docs.filter(x => x.type === 'tutorial');
    const surveys = d.docs.filter(x => x.type === 'survey');
    function group(title, arr) {
      if (!arr.length) return '';
      let s = '<div class="concept-panel__group">' + title + '</div>';
      arr.forEach(x => {
        s += '<a class="concept-panel__doc" href="' + esc(x.url) + '">'
          + '<span class="concept-panel__doc-title">' + esc(x.title) + '</span>'
          + (x.date ? '<span class="concept-panel__doc-date">' + esc(x.date) + '</span>' : '')
          + '</a>';
      });
      return s;
    }
    html += group('论文', papers);
    html += group('教程', tuts);
    html += group('调研', surveys);
    if (!d.docs.length) html += '<p class="concept-panel__empty">还没有论文/教程/调研提到此概念。</p>';
    html += '<a class="concept-panel__more" href="' + esc(d.pageUrl) + '">查看完整概念页 →</a>';
    pBody.innerHTML = html;
    panel.classList.add('open');
    panel.setAttribute('aria-hidden', 'false');
  }
  function closePanel() { panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); cy.$(':selected').unselect(); }
  document.getElementById('panel-close').addEventListener('click', closePanel);

  cy.on('tap', 'node', evt => openPanel(evt.target.data('raw')));
  cy.on('tap', evt => { if (evt.target === cy) closePanel(); });

  // --- search ---
  const search = document.getElementById('graph-search');
  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    cy.nodes().removeClass('hl dim');
    if (!q) return;
    const matches = cy.nodes().filter(n => {
      const d = n.data('raw');
      return (d.name || '').toLowerCase().includes(q) || (d.slug || '').toLowerCase().includes(q);
    });
    cy.nodes().not(matches).addClass('dim');
    matches.addClass('hl');
    if (matches.length) cy.animate({ fit: { eles: matches, padding: 80 } }, { duration: 300 });
  });

  // --- buttons ---
  document.getElementById('btn-fit').addEventListener('click', () => cy.fit(undefined, 40));
  document.getElementById('btn-reset').addEventListener('click', () => {
    search.value = ''; slider.value = 1;
    cy.nodes().removeClass('hl dim'); applyWeight(); cy.fit(undefined, 40);
  });

  applyWeight();
})();
</script>
