<script>
window.__GRAPH__ = {"version": 1, "generated_at": "unknown", "nodes": [{"id": "papers/asymflow-2026", "type": "paper", "slug": "asymflow-2026", "title": "AsymFlow: 秩-非对称速度参数化, 把 latent 流匹配模型 lift 到像素空间", "date": "2026-05-25", "tldr": "Stanford (Wetzstein/Guibas 组, arXiv 2026/05/13)。像素扩散用 plain DiT 的瓶颈是 velocity 目标 u = ε − x₀ 里那个 full-rank 高斯噪声污染 transformer hidden state。AsymFlow 把 velocity 拆开非对称: data 项 −x₀ 保持 full-rank, noise 项限到 rank-r 子空间, 即 u_A := Pε − x₀, 训练时网络只预测 u_A, sampling 时解析还原 full-rank。r=0 退化 x₀-pred, r=D 退化 u-pred, 中间是新东西。子空间用 PCA 或 latent→pixel Procrustes 对齐构造。架构 / training-loop / sampler 一字不改。结果: ImageNet 256 上 1.57 FID (JiT-H/16 + REPA), 是 plain transformer 像素扩散 SOTA; 从 FLUX.2 klein 9B Procrustes-lift 得到 AsymFLUX.2 klein, 是<em>第一个</em>把大型 latent flow 直接转成像素生成器的方法, 在 HPSv3/DPG/GenEval 上全面超过 latent base。", "url": "papers/asymflow-2026/index.html"}, {"id": "papers/awm-2025", "type": "paper", "slug": "awm-2025", "title": "Advantage Weighted Matching: 把扩散模型 RL 拽回到预训练目标", "date": "2026-05-15", "tldr": "UCAS + Adobe + HKU + MIT。一个定理 + 一个简单替换:DDPO/Flow-GRPO 那套 per-step 高斯似然其实是 noisy-$x_s$ 上的 DSM,多出 $d\\cdot\\kappa(s,t)$ 的目标向量方差,这是它收敛慢的根。AWM 把 RL surrogate 直接换回预训练用的 flow matching loss × advantage,decouple sampler/training,SD3.5-M 上 OCR 23.6× / GenEval 8× / PickScore 10× 加速,同质量。但 release 代码里 $\\beta$、$w(t)$、EMA 自蒸馏三处跟论文不一致。", "url": "papers/awm-2025/index.html"}, {"id": "papers/boogu-image-2026", "type": "paper", "slug": "boogu-image-2026", "title": "Boogu-Image-0.1：用 1/10 数据做开源「统一生成+编辑」大模型（代码精读）", "date": "2026-06-16", "tldr": "Boogu-Image-0.1 是一个 Apache-2.0 开源的「统一文生图 + 图像编辑」模型族（Base / Edit / Turbo，均 10B），主打照片级真实感和中英双语文字渲染，号称用比同类开源模型少约一个数量级的训练数据做到接近闭源（GPT-Image-2 / Nano-Banana-Pro）的水平。\n架构是 Lumina-Image-2 谱系的 DiT（noise/context/ref 三套 refiner + 双流/单流 MMDiT 块），文本条件来自一个 Qwen3-VL 多模态大模型（既当指令编码器、又当 prompt 改写/推理器）；Turbo 变体用 Decoupled DMD 蒸馏到 4 步、无 CFG。\n⚠️ 正式技术报告尚未发布（仓库标注 \"Coming Soon\"），本文是基于 README + 推理代码的交叉精读，非官方报告解读。\n", "url": "papers/boogu-image-2026/index.html"}, {"id": "papers/d-opsd-2026", "type": "paper", "slug": "d-opsd-2026", "title": "D-OPSD: On-Policy Self-Distillation for Continuously Tuning Step-Distilled Diffusion Models", "date": "2026-05-12", "tldr": "HKUST/阿里 Z-Image Team:让 Z-Image-Turbo (8 步) 和 FLUX.2-klein (4 步) 能\"边用边学\"新概念 — 同一模型分饰 student (text) 和 teacher (text+target_img),在 student 自采轨迹上 self-distill,无需 reward。", "url": "papers/d-opsd-2026/index.html"}, {"id": "papers/d4rt-2025", "type": "paper", "slug": "d4rt-2025", "title": "Efficiently Reconstructing Dynamic Scenes One D4RT at a Time", "date": "2026-06-06", "tldr": "CVPR 2026 最佳论文 (Google DeepMind)。把\"重建动态 4D 场景\"这件事从\"逐帧稠密解码\"改成\"按需点查询\":一个 encoder 把视频压成固定的 Global Scene Representation,一个轻量 cross-attention decoder 接收查询 q=(u,v,t_src,t_tgt,t_cam) 独立吐出该点的 3D 坐标。改一改查询就能统一拿到深度、点云、点轨迹、相机内外参 —— 速度比 VGGT 快 9×、比 MegaSaM 快 100×,且是唯一能稠密重建动态像素的方法。\n", "url": "papers/d4rt-2025/index.html"}, {"id": "papers/dapo-2025", "type": "paper", "slug": "dapo-2025", "title": "DAPO: An Open-Source LLM Reinforcement Learning System at Scale", "date": "2026-05-12", "tldr": "字节 + 清华 AIR 的 R1 复现:Qwen2.5-32B base 上 4 个工程修复 (Clip-Higher / Dynamic Sampling / Token-Level Loss / Overlong Reward Shaping) 把 GRPO 从 30 推到 50 AIME24,只用 R1-Zero 50% step。代码+数据+权重全开源。", "url": "papers/dapo-2025/index.html"}, {"id": "papers/deepseek-v4-2026", "type": "paper", "slug": "deepseek-v4-2026", "title": "DeepSeek-V4: Towards Highly Efficient Million-Token Context Intelligence", "date": "2026-05-12", "tldr": "1.6T MoE / 1M context。CSA+HCA 混合注意力把 KV cache 砍到 V3.2 的 10%,残差用 Sinkhorn 投影双随机矩阵稳定 61 层堆叠。", "url": "papers/deepseek-v4-2026/index.html"}, {"id": "papers/diffusion-opd-2026", "type": "paper", "slug": "diffusion-opd-2026", "title": "DiffusionOPD: 把 LLM 的 On-Policy Distillation 抬到 diffusion 上, 一个 closed-form 反向 KL 干掉 multi-task RL 的 PPO 噪声", "date": "2026-05-14", "tldr": "Fudan + 阿里 Wan Team (arXiv 2026/05/14)。多任务 diffusion RL 现有两条路都不好走: joint 多目标互相打架 + 难任务被压制, cascade 多阶段繁琐 + 灾难遗忘。DiffusionOPD 抄 LLM 的 On-Policy Distillation (OPD) 思路, 把它从 token 序列搬到 Euler-Maruyama 离散化的反向 SDE: 学生和老师在同一个噪声 schedule 上有同协方差的 one-step Gaussian transition, 反向 KL 解析地坍缩成 $\\|\\mu^S - \\mu^T\\|^2 / (2\\bar\\sigma^2)$, 在 ODE 极限 (a→0) 进一步退化成纯 L2 transition matching (Eq. 12)。配 round-robin 多 teacher (per-task LoRA adapter), 一个 backward 一个 round。SD3.5-M 上 GenEval 0.96 + OCR 0.94 + Aes 6.15, average 0.929 反超 cascade NFT 0.851 / multi-task NFT 0.715, 总 wall-clock 比 cascade 少 ~50 GPU h。论文最有教育意义的是 §3.3: PPO-style 跟 closed-form KL 期望梯度相同, 但 PPO 多一个 $\\epsilon_j / \\bar\\sigma_j$ 的 score-function 项, 是纯方差; 而 closed-form 通过 pathwise gradient 完全消掉这一项。\n", "url": "papers/diffusion-opd-2026/index.html"}, {"id": "papers/ferret-2023", "type": "paper", "slug": "ferret-2023", "title": "Ferret：任意形状、任意粒度的「指代 + 定位」多模态大模型", "date": "2023-10-11", "tldr": "Ferret 用「混合区域表示」（离散坐标 + 连续特征）把用户圈的任意形状区域（点/框/涂鸦/自由形状）编码进 LLM 输入，同时在输出端把名词后接坐标实现定位——一个模型统一了 referring（区域→语义）和 grounding（语义→区域）。\n它是 LISA「文本→掩码」的**输入侧对偶**：LISA 解决\"想哪打哪\"的输出，Ferret 解决\"圈哪问哪\"的输入。\n", "url": "papers/ferret-2023/index.html"}, {"id": "papers/ferret-v2-2024", "type": "paper", "slug": "ferret-v2-2024", "title": "Ferret-v2：给「指代+定位」MLLM 装上高分辨率的眼睛", "date": "2024-04-11", "tldr": "Ferret-v2 是 Ferret 的重大升级,三招破解\"固定低分辨率编码器看不清小物体\":(1) any-resolution——把大图切成子块各自编码,保住 CLIP 预训练知识;(2) 多粒度双编码器——全局图用 CLIP 抓语义、局部块用 DINOv2 抓细节;(3) 三阶段训练,中间插一个\"高分辨率密集对齐\"阶段。\n它把 [[ferret-2023|Ferret]] 的输入侧 grounding 推到高分辨率密集感知,也是 Ferret-UI 屏幕理解的技术底座。\n", "url": "papers/ferret-v2-2024/index.html"}, {"id": "papers/flow-opd-2026", "type": "paper", "slug": "flow-opd-2026", "title": "Flow-OPD: On-Policy Distillation for Flow Matching Models", "date": "2026-05-12", "tldr": "USTC/UCLA/CUHK/小红书:把 LLM 的 OPD 范式严格搬到 flow matching — SDE 共方差结构让 reverse-KL 退化为速度场 L2,多教师 dense 监督 + MAR 美学锚定。SD-3.5-M 上 GenEval 63→92, OCR 59→94。", "url": "papers/flow-opd-2026/index.html"}, {"id": "papers/ggt-100k-2026", "type": "paper", "slug": "ggt-100k-2026", "title": "GGT-100K：用多模态大模型「生成」真实世界修复的 Ground Truth", "date": "2026-06-01", "tldr": "真实世界图像修复（IR）卡在「没有成对训练数据」：合成退化不像真的，真实成对数据又贵又难采。GGT-100K 的思路是——既然没有干净参考图，那就让生成式多模态大模型（MFM）「画」一张出来当 ground truth。\n作者系统评测了 9 个 MFM × 4 种提示策略，发现 Nano-Banana-2 + Gemini 自适应提示在「保真 + 感知 + 无幻觉」上最均衡；再用它配合「指标过滤 → VLM 复检改写 → 人工验收」三级质控，构建出 103,707 对 LQ-HQ 训练对 + 500 对测试集。用它训各类 IR 模型都涨点，对生成式修复模型（FLUX/Qwen-Image-Edit）增益尤其大。\n", "url": "papers/ggt-100k-2026/index.html"}, {"id": "papers/ideogram-4-2026", "type": "paper", "slug": "ideogram-4-2026", "title": "Ideogram 4: 9.3B single-stream DiT,从 Qwen3-VL 拼接 13 层特征 + 结构化 JSON prompt + MRoPE 共享 text/image 位置空间", "date": "2026-06-03", "tldr": "Ideogram 首个开源权重 (2026-06-03 同日 release 代码 + weights, **9.3B 参数, 非任何已有模型微调**)。技术报告无 arxiv,只有 blog (ideogram.ai/blog/ideogram-4.0) + GitHub repo (ideogram-oss/ideogram4) 里的 docs。架构亮点:**单流 DiT** (跟 SD3/FLUX 的 MMDiT 双流相反),34 层 transformer 把\"text token + image latent token\"拼成一根 sequence,共享 self-attention; text encoder 用 **frozen Qwen3-VL-8B-Instruct**,从第 0/3/6/9/12/15/18/21/24/27/30/33/35 层共 13 层 hidden state **沿 feature 维拼接** (得到 4096×13 = 53248 维 text feature);**MRoPE 3D 位置编码** (section 24/20/20: 时间/高/宽,text token 用 1D position 广播到 3 轴) 让两类 token 处于统一空间,无需 cross-attention; flow matching + Euler sampler + logit-normal noise schedule (按分辨率自适应 mu = mu_base + 0.5·log(N_pixels / 512²));**asymmetric CFG** (unconditional pass 只走 image token, 省计算)。训练数据完全是**结构化 JSON caption** (high_level / style / compositional_deconstruction with bbox)。基准: Design Arena open-weight 第一,ContraLabs 排版 47.9% 一胜率超过 Nano Banana 2 / FLUX.2 [max] / Grok Imagine 1.0,7Bench layout / X-Omni OCR 上是 9.3B 级最强。**License**: Ideogram 4 Non-Commercial (不能商用)。\n", "url": "papers/ideogram-4-2026/index.html"}, {"id": "papers/l2p-2026", "type": "paper", "slug": "l2p-2026", "title": "L2P: 把 LDM 的潜在知识搬到像素空间, 8 卡训出原生 4K 扩散", "date": "2026-05-22", "tldr": "南大 + 腾讯优图 (arXiv 2026/05)。直接拆掉 VAE, 用 16×16 大 patch 把像素图打成 token, 接预训练好的 LDM (Z-Image-Turbo) DiT block, 只让首尾若干层 + 一个 U-Net Detailer Head 可训, 训练数据是源 LDM 自己生成的 20k 张合成图。8 张 GPU、零真实数据采集, DPG-Bench 86.00 超过源 LDM 84.86, GenEval 保留 93.6%; 取消 VAE 内存瓶颈后, 原生 4K 单步推理时间砍 97.67%、峰值显存降 38.81%。本质是把训练像素扩散从零的灾难性 cold start 换成从已经平滑的 LDM 流形上做轻量迁移。", "url": "papers/l2p-2026/index.html"}, {"id": "papers/latent-to-pixel-2026", "type": "paper", "slug": "latent-to-pixel-2026", "title": "Latent→Pixel 迁移对比: AsymFlow vs L2P 同问题、同月份、完全不同的刀法", "date": "2026-05-25", "tldr": "对比阅读 arXiv 2605.12964 (AsymFlow, Stanford) 和 2605.12013 (L2P, 南大+腾讯优图), 上传只差一天。同一个核心问题: 怎么把预训练 LDM (FLUX.2 / Z-Image) 的能力『搬到』像素空间, 而不是从零训像素扩散。AsymFlow <strong>动 loss 不动架构</strong>: 重新设计 velocity 参数化 u_A := Pε − x₀, Procrustes 把 latent flow 数学上 lift 成 rank-d 像素 flow, 9B base, 全面超过 latent。L2P <strong>动架构不动 loss</strong>: 抛 VAE 改大 patch, 冻结 LDM 中间 28 层 + Detailer Head, 训练用 LDM 自生成 20k 合成图, 8 卡解锁原生 4K。本文按 改造层 / VAE 处理 / 训练数据 / 算力 / 推理流程 五个维度并排, 给出决策树和共同盲点。两者互不冲突, 未来一年会看到组合工作。", "url": "papers/latent-to-pixel-2026/index.html"}, {"id": "papers/leap-align-2026", "type": "paper", "slug": "leap-align-2026", "title": "LeapAlign: Post-Training Flow Matching Models at Any Generation Step by Building Two-Step Trajectories", "date": "2026-05-12", "tldr": "ANU/ByteDance:Flux reward fine-tune 时不 backprop 完整 25 步链,而是随机抽 (k,j) 两步构造 leap trajectory + stop_gradient connector,可触及最早期步,Attribute Binding 45→66。", "url": "papers/leap-align-2026/index.html"}, {"id": "papers/lisa-2023", "type": "paper", "slug": "lisa-2023", "title": "LISA：用大语言模型做「推理分割」", "date": "2023-08-01", "tldr": "LISA 给多模态大模型加一个 `<SEG>` token，把这个 token 的最后一层隐藏向量当作 SAM 的「文本提示」直接解码成掩码（embedding-as-mask），端到端用 LoRA 训练。\n由此首次让 LLM 能根据「需要推理的隐式指令」输出分割掩码，并开创了一整条 `<SEG>`-token 像素级多模态大模型的研究路线。\n", "url": "papers/lisa-2023/index.html"}, {"id": "papers/locate-anything-2026", "type": "paper", "slug": "locate-anything-2026", "title": "LocateAnything: 把 VLM 的 bbox 输出当作不可分割原子,一次 forward 出 4 个坐标,12.7 BPS 跑赢 NTP 5×", "date": "2026-05-27", "tldr": "NVIDIA + HK PolyU + Princeton + Nanjing + UIUC (arXiv 2026/05/27)。指出主流 VLM (Qwen3-VL / DeepSeek-VL2 / Rex-Omni) 输出 bbox 都把 4 个坐标当 token 序列 (x1, y1, x2, y2) 串行 next-token-predict——这是几何上耦合的 4-tuple 被人为序列化,既损精度又限吞吐。**Parallel Box Decoding (PBD)**: 把整个 bbox (4 坐标 + 2 个 <box>/</box> 结构 token = 长度 L=6 的 atomic block) 一次性并行预测,而非逐 token 输出。block 内 bidirectional attention 让 4 个坐标互相看到,block 间 causal attention 保持自回归语义。**关键 trick**: 训练时把同一 GT 同时塞两种格式 (`x_ntp` + `x_blk`) 让模型 joint 学 NTP + MTP,**通过 attention mask 让两条 stream 互不串话**(都看 shared context 但 MTP block 看不到 NTP token 反之亦然)。推理三模式: Fast (纯 MTP),Slow (纯 NTP),Hybrid (默认 MTP,format 异常或 top-1 prob < 0.7 时回退 NTP 重 decode 该 block)。LocateAnything-Data 138M queries / 12M images / 785M bbox 涵盖 detection + UI + referring + OCR + layout + pointing 6 大任务。结果: LocateAnything-3B 在 LVIS F1@0.95 上 31.1 (vs Qwen3-VL-8B 的 20.2 / Rex-Omni-3B 的 20.7),Throughput 12.7 BPS = **比 Qwen3-VL-8B 快 12.7×、比 Rex-Omni 快 2.5×**。\n", "url": "papers/locate-anything-2026/index.html"}, {"id": "papers/molmo-2024", "type": "paper", "slug": "molmo-2024", "title": "Molmo & PixMo: 把「指」做成一等公民——2.3M 人工 pointing 数据如何点燃开源 VLM 的 grounding 能力", "date": "2024-09-25", "tldr": "AllenAI + UW (arXiv 2409.17146, 2024/09)。当时最强开源 VLM 几乎都靠蒸馏 GPT-4V 合成数据,等于把闭源模型「偷」进开源。Molmo 反其道:**全程不用任何 VLM 生成训练数据**,核心是一套叫 PixMo 的自采数据集。最大创新是 **PixMo-Points**——让未受训标注员「点」图中物体 (语音描述 + 逐实例点击),收了 **2.3M question-point 对 / 223k 图**。Pointing 在 Molmo 里有三个用途:(1) 按文字指代去**点**物体;(2) **数数靠点**——把点序列当成一条 chain-of-thought,逐个点完再求和,counting 直接屠榜;(3) 把点当**视觉解释**塞进回答。模型把点输出成归一化到 0–100 的纯文本坐标 `<point x=\"63.5\" y=\"44.5\" alt=\"Mt. Rainier\">Mt. Rainier</point>`。架构是标准 ViT + connector + LLM,但有两个干净的工程点:**overlapping multi-crop** 解决裁剪边界丢上下文,**2×2 mean-query attention pooling** 压视觉 token。72B 版本学术 benchmark 第一、人评仅次于 GPT-4o,counting 任务全场最强。本质上,Molmo 是后来 [[locate-anything-2026]] (bbox 作 first-class **输出**) 和 [[thinking-visual-primitives-2026]] (primitives 作 first-class **思维**) 的共同祖先——这两篇 2026 的工作都直接拿 PixMo/Molmo 当 grounding 数据来源。\n", "url": "papers/molmo-2024/index.html"}, {"id": "papers/mrt-2026", "type": "paper", "slug": "mrt-2026", "title": "MRT: 一个 20B masked region transformer 把分层图生成的三个任务塞进同一个模型", "date": "2026-05-26", "tldr": "Canva Research (arXiv 2026/05/26, CVPR'26 poster)。多层 RGBA 图生成长期落后于平面图生成,是因为 (1) 缺大规模数据,(2) 缺一个能复用 SOTA 平面图先验的架构。MRT 同时解决两件事:从 Canva 设计平台拿 10M 多语言分层设计样本 + 在 Qwen-Image 20B 上做 full-parameter fine-tune(不再是 LoRA),用一个 masked region transformer 把三个任务(text→layers / image→layers / layers→layers 编辑)塞进同一个模型——核心机制是 adaptive masking 决定每个 region token 是\"干净条件\"还是\"加噪去噪目标\"。沿用 ART [38] 的 regional latents(每层独立 VAE 编码,token 数 = O(层面积) 而非 O(全画布)),加一个 overflow-aware canvas layer 让超出边界的元素保持完整。DMD2 蒸馏到 8 步,推理在 20 层时比同期 Qwen-Image-Layered 快 100×、省 50-90% 显存。**注意:论文 5 月 26 日上传,官方代码尚未公开**(Canva GitHub org 无 repo)。\n", "url": "papers/mrt-2026/index.html"}, {"id": "papers/oftsr-2024", "type": "paper", "slug": "oftsr-2024", "title": "OFTSR：一步超分 + 可调「保真度↔真实感」的整条曲线", "date": "2024-12-12", "tldr": "OFTSR 用两阶段方案做单步图像超分：先训一个「噪声增广的条件 rectified flow」当教师，再蒸馏出一个一步学生网络——蒸馏的约束是「学生从不同时间 t、s 的预测必须落在教师同一条 PF-ODE 轨迹上」。\n关键好处：一步推理时只需调一个超参 t，就能在「高 PSNR / 高保真」和「低 LPIPS / 高真实感」之间连续滑动，把感知-失真权衡的整条曲线塞进单步模型，而过去的单步蒸馏只能锁死在曲线上的一个点。\n", "url": "papers/oftsr-2024/index.html"}, {"id": "papers/osprey-2023", "type": "paper", "slug": "osprey-2023", "title": "Osprey:把「掩码」喂进 MLLM 的像素级区域理解", "date": "2023-12-15", "tldr": "Osprey 把 referring 的输入从「框」升级到「掩码」:用 mask-aware visual extractor 在卷积 CLIP(ConvNeXt-L)的多尺度特征图上做 mask-average-pooling 抽语义、再把掩码本身展平投影成 spatial token,两者替换文本里的 <region> 占位符喂给 LLM。配 724K 掩码-文本指令数据(Osprey-724K),在开放词表分割、部件级分类、区域描述上全面超过 box 级方法和 Ferret。\n它是 [[ferret-2023|Ferret]]「自由形状区域输入」的掩码精化版,也是 [[lisa-2023|LISA]] 输出侧掩码的输入侧对偶。\n", "url": "papers/osprey-2023/index.html"}, {"id": "papers/q-ground-2024", "type": "paper", "slug": "q-ground-2024", "title": "Q-Ground: Image Quality Grounding with Large Multi-modality Models", "date": "2024-07-24", "tldr": "ACM MM 2024 Oral(南洋理工 + 商汤)。第一个做\"细粒度画质 grounding\"的工作:不再只给一张图打一个总分/一段评语,而是把**画质缺陷的具体位置**分割出来。核心贡献是 **QGround-100K 数据集** —— 10 万条 (图像, 画质描述文本, 失真分割掩码) 三元组,建在 Q-Instruct/Q-Pathway 之上,锁定 5 种失真(模糊/过曝/噪声/抖动/低光),掩码用固定颜色编码。制作走**双轨标注**:① 15 名人工标注员(SAM 预分割 + 参考画质文本手调边界);② GPT4V 自动标注(Set-of-Mark:SAM 分割 + 编号 → GPT4V 给每个区域判失真类型)。人工 17,963 图 / 52,924 标注 + GPT4V 50,599 图。配套 Q-Ground 模型(PixelLM 式 [SEG] token + 多尺度投影 MSFA)。\n", "url": "papers/q-ground-2024/index.html"}, {"id": "papers/qwen-image-2-2026", "type": "paper", "slug": "qwen-image-2-2026", "title": "Qwen-Image-2.0 Technical Report", "date": "2026-05-12", "tldr": "Qwen 75 人团队:Qwen3-VL 当冻结 condition encoder + MMDiT + 自研 f16c64 高压缩 VAE (latent 体积 4× 少,重建跟 f8c16 持平)。1k token 中文长文本渲染 + RLHF + DMD 4-NFE 蒸馏。LMArena T2I 中文 #1。", "url": "papers/qwen-image-2-2026/index.html"}, {"id": "papers/rep-forcing-2026", "type": "paper", "slug": "rep-forcing-2026", "title": "Representation Forcing: 让 UMM 自己长出 VAE 替代品——把 understanding encoder 的特征蒸成离散 token, 当作 pixel diffusion 的 in-context structural scaffold", "date": "2026-05-29", "tldr": "HKU + ByteDance Seed + CUHK + 南大 + 清华 (arXiv 2026/05/29)。Unified Multimodal Model (UMM) 的\"用 frozen VAE 当 latent 空间\"是 bottleneck —— VAE 是为 reconstruction 训的, 不是为 UMM 的 understanding+generation 联合目标训的;但如果直接拿掉 VAE 在 pixel 空间生成, 又会缺\"高层结构指引\",GenEval 从 0.52 直接掉到 0.25。Representation Forcing (RF) 的解法:让 decoder **先 autoregressive 地生成一串 \"representation tokens\"**(来自模型自己的 understanding encoder DINOv3 的特征, 经在线 vector quantization 量化), 这些 rep tokens 留在 context 里, **pixel patches 通过共享 self-attention 看到它们做 diffusion**——同一个 backbone 内完成\"先决定语义结构、再渲染像素\"。架构基于 BAGEL 的 MoT (三组 expert: understanding / rep / pixel),从 Qwen3-A3B (3B activate) 初始化。结果:RF-Pixel GenEval 0.84 / DPG 84.15,匹配 VAE-based BAGEL (0.82 / 85.07);理解任务上 Pixel+RF 比 VAE+RF 在 6/8 benchmark 上更好。最有意思的消融是 §4.4 的 RF vs REPA:同样用 DINOv3 当 rep 源,REPA 的 auxiliary alignment 只到 0.43, RF 的\"放到 sequence 里做 in-context conditioning\"到 0.76——**direct in-context > implicit feature alignment**。\n", "url": "papers/rep-forcing-2026/index.html"}, {"id": "papers/rls-razor-2025", "type": "paper", "slug": "rls-razor-2025", "title": "RL's Razor: Why Online Reinforcement Learning Forgets Less", "date": "2026-05-12", "tldr": "MIT Improbable AI 的诊断式论文:RL 比 SFT 少遗忘,根因不是负样本,而是 on-policy 采样隐式逼向 KL-min 解;forward KL on new task 是唯一可靠预测变量 (R²=0.96)。", "url": "papers/rls-razor-2025/index.html"}, {"id": "papers/self-flow-2026", "type": "paper", "slug": "self-flow-2026", "title": "Self-Supervised Flow Matching for Scalable Multi-Modal Synthesis", "date": "2026-05-13", "tldr": "BFL + MIT:REPA 类外部对齐反向 scaling(encoder 越强 FID 越差),跨模态崩。Self-Flow 把表征学习内嵌到 flow matching — Dual-Timestep Scheduling 给不同 token 加不同噪声制造信息不对称,EMA self-teacher 在 $\\min(t,s)$ 上看更干净版本。625M 超 REPA 1B,T2I/V/A 全模态 SOTA。", "url": "papers/self-flow-2026/index.html"}, {"id": "papers/self-forcing-2025", "type": "paper", "slug": "self-forcing-2025", "title": "Self Forcing: 自展开训练让因果视频扩散摆脱 exposure bias", "date": "2026-05-22", "tldr": "Adobe + UT Austin (NeurIPS 2025)。把训练时序流程改成跟推理一样的 KV-cache 自回滚: 学生在自己生成的过去 frames 上 condition, 用 holistic DMD/SiD/GAN loss 直接匹配整段视频分布。靠一个随机选时间步 s + 只在第 s 步开梯度的 stochastic gradient truncation, 把『看似不能并行』的训练塞进 1.5 小时收敛 (64×H100)。配上 rolling KV cache + 训练时 mask 掉首 chunk 这两个工程细节, 1.3B 模型在单 H100 上跑 17 FPS、0.69s latency, VBench 反超 14B 教师模型 Wan2.1 (84.31 vs 84.26)。", "url": "papers/self-forcing-2025/index.html"}, {"id": "papers/sensenova-u1", "type": "paper", "slug": "sensenova-u1", "title": "SenseNova-U1: Unifying Multimodal Understanding and Generation with NEO-unify Architecture", "date": "2026-05-11", "tldr": "不用 ViT 也不用 VAE 的\"理解+生成\"统一模型，直接在像素空间做 flow matching，把两条流装进同一个 Mixture-of-Transformers。", "url": "papers/sensenova-u1/index.html"}, {"id": "papers/starchild-1-2026", "type": "paper", "slug": "starchild-1-2026", "title": "Starchild-1: 把双向音视频扩散教成 24fps 流式世界模型", "date": "2026-05-19", "tldr": "Team Odyssey 技术报告。把 Ovi (双向 50 步、离线、固定时长音视频扩散) 通过三阶段管线蒸馏成 24fps 因果流式世界模型: (1) DMD 少步双向蒸馏 + 拉高 audio/fake-critic 学习率,(2) 块因果 ODE 轨迹适配 (audio CFG=7、MSE+AdamW、关 weight decay),(3) KV-cache 自回滚 (Self-Forcing) + 非对称 sink token (video 有/audio 没有) + 跨模态 cache 不重置。外加一个 LLM-based campaign orchestrator 把用户输入转成 chunk-aligned action 序列。视觉感知指标小升,音频语义对齐 (CLAP/IB) 明显回退,同步指标基本不变。无 code、无 weights、全部交互能力只做 qualitative example。", "url": "papers/starchild-1-2026/index.html"}, {"id": "papers/thinking-visual-primitives-2026", "type": "paper", "slug": "thinking-visual-primitives-2026", "title": "Thinking with Visual Primitives: 让 MLLM 在思考时 \"用手指点\"——points/bboxes 作为最小思维单元穿插进 CoT 推理链", "date": "2026-04-30", "tldr": "DeepSeek + 北大 + 清华 (技术报告 2026/04/30 release,代码 + 权重未公开)。MLLM 现在解决了 *Perception Gap* (高清 cropping / thinking-with-images),但还堵在 **Reference Gap** ——自然语言对密集空间布局指代太模糊,导致计数 / 拓扑推理时 \"逻辑塌方\"。提出 **Thinking with Visual Primitives**: 把 points / bboxes 当**思维原子**直接 interleave 进推理 trajectory,模型一边推理一边 \"点\",把抽象语言概念锚到具体物理坐标。架构: DeepSeek-V4-Flash (284B MoE / 13B active) + DeepSeek-ViT。**视觉 token 压缩**: ViT 输出 3×3 spatial pooling (×9 压缩) + LLM 的 CSA (Compressed Sparse Attention) 把每 4 个 visual token 的 KV cache 压成 1 entry → 756×756 输入 (571,536 pixel) 最终 KV cache 仅 **81 entries**,**总压缩比 7,056×**。Pretraining 用 trillion+ tokens, 自建 40M 高质量 box-grounding 数据 (从 HF / 网络爬,两阶段 LLM 审核过滤)。Post-training 4 阶段: Specialized SFT → Specialized RL (GRPO 配 Format/Quality/Accuracy 3 个 RM) → Unified RFT → On-Policy Distillation。Cold-start 4 个任务: counting (10k), spatial reasoning (9k), maze navigation (460k), path tracing (125k)。结果: 选定子集 benchmark 上跟 **GPT-5.4 / Claude-Sonnet-4.6 / Gemini-3-Flash** 持平或反超,而 token efficiency 是这些 frontier model 的 1/8 到 1/10。本质是把 [[locate-anything-2026]] 的\"bbox 是 first-class output\" 进一步推进成\"bbox 是 first-class **thought**\"。\n", "url": "papers/thinking-visual-primitives-2026/index.html"}, {"id": "papers/tm-interaction-2026", "type": "paper", "slug": "tm-interaction-2026", "title": "Interaction Models: A Scalable Approach to Human-AI Collaboration", "date": "2026-05-12", "tldr": "不是把实时性做成 model 外面的 harness,而是按 200ms micro-turn 把模型重新设计 — 双流并行、encoder-free 早融合、双模型分工。FD-bench v1.5 拿 77.8 vs 竞品 45-55。", "url": "papers/tm-interaction-2026/index.html"}, {"id": "papers/tstars-tryon-2026", "type": "paper", "slug": "tstars-tryon-2026", "title": "Tstars-Tryon 1.0: Robust and Realistic Virtual Try-On for Diverse Fashion Items", "date": "2026-05-14", "tldr": "阿里 Pailitao:把 try-on 从 inpainting 重新定义为通用多图编辑,5B MMDiT + 五阶段训练(预训→渐进分辨率→垂域 SFT→DiffusionNFT 多奖励 RL→CFG+Step 蒸馏)。Tstars-VTON Bench 上 Overall 9.372 力压 GPT-Image-2 / Nano Banana Pro,单衣 3.92s / 多件 6.74s 比开源快 25-50×。已上线淘宝 App。论文是产品报告 + benchmark 论文 — 模型无开源、无 method 章节、无 ablation。", "url": "papers/tstars-tryon-2026/index.html"}, {"id": "papers/tuna-2", "type": "paper", "slug": "tuna-2", "title": "Tuna-2: Pixel Embeddings Beat Vision Encoders for Multimodal Understanding and Generation", "date": "2026-05-12", "tldr": "Meta / HKU / Waterloo 的受控对比: Tuna → Tuna-R → Tuna-2 三阶段简化，砍掉 VAE 和 SigLIP 后理解反而更强，关键 trick 是 75% masking 当 regularizer。", "url": "papers/tuna-2/index.html"}, {"id": "papers/worldforge-2026", "type": "paper", "slug": "worldforge-2026", "title": "WorldForge: 不训练,把 6-DoF 相机轨迹\"注射\"进 Wan2.1 视频扩散模型", "date": "2026-05-13", "tldr": "Westlake AGI Lab + NTU (CVPR 2026 Highlight):IRR + FLF + DSG 三个 inference-time 模块插进 Wan2.1 I2V 的前 20 步采样。IRR 在干净 $\\hat{x}_0$ 空间做 per-step predict-correct,FLF 利用 VAE channel 的运动语义分工 (channel 8 = 运动 / channel 13 = 纹理) 只覆写部分 channel,DSG 用 CFG-Zero 正交投影合并\"自由\"与\"受控\"两条路径。3D FID 96 / 4D FVD 93 SOTA,零训练。", "url": "papers/worldforge-2026/index.html"}, {"id": "tutorials/opd-diffusion-2026", "type": "tutorial", "slug": "opd-diffusion-2026", "title": "OPD 在 Diffusion / Flow Matching 上的应用:三兄弟 + 分布匹配蒸馏 + 统一视角", "date": "2026-06-09", "tldr": "7 节螺旋系统讲透 On-Policy Distillation(OPD)如何从 LLM 的 GKD 搬到扩散/flow matching。地基是一个折叠:SDE 同协方差让 reverse-KL 解析坍缩成速度场 L2(ODE 极限退化成纯 L2)。在此之上讲\"三兄弟\":Flow-OPD(留住 RL:PPO+task reward+MAR,能反超 teacher)、DiffusionOPD(砍掉 RL:closed-form 直接 loss,§3.3 论证 PPO 是纯方差)、D-OPSD(teacher=EMA 自己,reward-free 自蒸馏,少步模型边用边学);再讲近亲 DMD/SiD 分布匹配蒸馏(为提速),最后收敛到一个统一模板\"在 student 自采轨迹上匹配 teacher 的 per-state 目标\"+ 四个选择轴。代码 verbatim 引自 CostaliyA/Flow-OPD、DiffusionOPD、vvvvvjdy/D-OPSD、tianweiy/DMD2 真实训练脚本(均经 diff 验证)。\n", "url": "tutorials/opd-diffusion-2026/index.html"}, {"id": "tutorials/rl-for-diffusion-2023", "type": "tutorial", "slug": "rl-for-diffusion-2023", "title": "扩散模型强化学习: 从 DDPO 到 AWM 的方法演进与代码实现", "date": "2026-05-17", "tldr": "8 节螺旋结构系统讲透扩散模型 RL fine-tuning 的完整发展脉络 (2023.05 - 2025.09)。覆盖 RWR/ReFL → DDPO → DPOK → GRPO → Flow-GRPO → Dance-GRPO → AWM,每个方法的\"修了什么/为什么修/代码怎么落\"全部讲清。代码 verbatim 引自 kvablack/ddpo-pytorch、yifan123/flow_grpo、XueZeyue/DanceGRPO、scxue/AWM 四个 repo。AWM 那章包含 Theorem 1+2 的完整推导和 paper-vs-code gap 警告。", "url": "tutorials/rl-for-diffusion-2023/index.html"}, {"id": "tutorials/rlhf-evolution-2024", "type": "tutorial", "slug": "rlhf-evolution-2024", "title": "RLHF 的演变：PPO → DPO → GRPO + Diffusion 的 RL", "date": "2026-05-14", "tldr": "从 \"policy 到底是什么\" 讲起,8 节螺旋结构 (直觉 → 最小 demo → 完整推导 → 真实 repo 代码引用 → 洞察)。覆盖 PPO/RLHF/DPO/GRPO 与 GRPO 后续 (DAPO/Dr.GRPO/GSPO),以及 Diffusion 侧的 DDPO/Diffusion-DPO。DPO 与 GRPO 两节代码深度对等,公式↔代码逐行对照。代码全部 verbatim 引自 huggingface/trl + 3 个对照 repo。", "url": "tutorials/rlhf-evolution-2024/index.html"}, {"id": "tutorials/step-distillation-2022", "type": "tutorial", "slug": "step-distillation-2022", "title": "Diffusion / Flow Matching 步数蒸馏:四大家族与可实践指南(PD → LCM-LoRA → DMD2 → MeanFlow/rCM)", "date": "2026-06-11", "tldr": "8 节螺旋系统讲透\"把 1000 步扩散/flow matching teacher 压到 1–4 步\"的四大家族:轨迹蒸馏(Progressive\nDistillation 逐次砍半 + ReFlow 拉直轨迹)、一致性家族(CM → 可直接复跑的 LCM-LoRA → 连续时间 sCM)、\n分布匹配(DMD/DMD2,real/fake score 差 = reverse-KL 梯度)、对抗蒸馏(官方未开源,用 DMD2 的 GAN\n分支佐证可实践)。覆盖 2025–2026 前沿(sCM/TrigFlow、MeanFlow 的 JVP 恒等式、NVIDIA rCM 视频蒸馏),\n每个主讲方法都配经 diff 逐行验证的开源训练代码(diffusers / openai CM / DMD2 / RectifiedFlow /\nMeanFlow 官方 / NVlabs rcm),终章给选型决策树 + 成本模型 + 踩坑清单。\n", "url": "tutorials/step-distillation-2022/index.html"}, {"id": "tutorials/vlm-benchmarks-2024", "type": "tutorial", "slug": "vlm-benchmarks-2024", "title": "VLM 评测 Benchmark 目录:测什么能力 · 怎么测 · 样题 · 模型如何被打分", "date": "2026-06-14", "tldr": "业界常见 VLM(视觉语言模型)评测 benchmark 的速查目录,按三层组织:通用能力(MMMU/MMBench/MME/SEED-Bench)、会读图会算(DocVQA/ChartQA/TextVQA/AI2D/MathVista)、幻觉与诚实(POPE/HallusionBench/MMStar)、grounding 定位(RefCOCO/LVIS/ScreenSpot/PixMo-Points)、细节瑕疵(MVTec-AD/VisA/QGround)。每个 benchmark 做成卡片:测什么能力、测试方法、一个样题(题型示意)、模型如何被喂入+生成+提取+打分、用什么指标。§1 先讲清「任何 VLM 被测试的通用流水线」;§8 补一节 2025 发布会评分卡(推理 / agentic / 新多模态:GPQA·HMMT·MMMLU·IFBench·BFCL·BrowseComp·SWE-bench·Terminal-Bench·MMMU-Pro·ERQA·OmniDocBench·Video-MME),并对照「判分从对答案到跑环境」的代际差异。真实评分代码 verbatim 引自 open-compass/VLMEvalKit、openvinotoolkit/anomalib 与 princeton-nlp/SWE-bench。\n", "url": "tutorials/vlm-benchmarks-2024/index.html"}, {"id": "tutorials/vlm-grounding-2025", "type": "tutorial", "slug": "vlm-grounding-2025", "title": "VLM Grounding 全景(2025–2026):从「框是输出」到「框是思维」", "date": "2026-06-06", "tldr": "9 节螺旋结构系统综述 2025–2026 视觉语言模型(VLM)的 grounding(视觉定位)浪潮:从「坐标如何变成 token」(三大编码流派)到「框作为输出」(检测/referring/Pointing/GUI/并行框解码)再到「框作为思维」(grounded reasoning)。覆盖 Kosmos-2/Shikra/Ferret/Grounding-DINO/Florence-2/PaliGemma/Qwen2.5-VL/Molmo/Rex-Omni/LocateAnything/Thinking-with-Visual-Primitives 等模型与技术报告,以及 RefCOCO/LVIS/ScreenSpot-Pro/PixMo-Points 等 18+ benchmark 的大盘点。代码 verbatim 引自 IDEA-Research/Rex-Omni 与 QwenLM/Qwen2.5-VL。两篇 anchor:Thinking with Visual Primitives 与 LocateAnything。文末附分类参考文献与技术报告全集。\n", "url": "tutorials/vlm-grounding-2025/index.html"}, {"id": "tutorials/vlm-industrial-2024", "type": "tutorial", "slug": "vlm-industrial-2024", "title": "VLM 在工业检测领域: 看清细节 · 数据制作 · 泛化能力", "date": "2026-05-20", "tldr": "把 VLM-based 工业缺陷检测 (Industrial Anomaly Detection) 这条线拆透。8 节螺旋结构覆盖 SOTA 演进 (2023-2026): vanilla CLIP 基线失败 → WinCLIP 多尺度窗口 → AnomalyCLIP object-agnostic prompt + DPAM 注意力修正 → AnomalyGPT LVLM + 合成数据 + 轻量 decoder + PEFT。三大主题各有专章:数据制作 (CutPaste → Perlin → Poisson 融合 → IMDD-1M 1M 图文对)、看清细节 (多尺度 + DPAM + 多层 decoder 三层栈)、泛化能力 (zero-shot → few-shot reference bank → cross-domain 17 数据集)。代码 verbatim 引自 zqhang/AnomalyCLIP、CASIA-IVA-Lab/AnomalyGPT、caoyunkang/WinClip、openvinotoolkit/anomalib 四个 repo。最后给出 timeline + decision tree 落地建议。", "url": "tutorials/vlm-industrial-2024/index.html"}, {"id": "concepts/diffusion", "type": "concept", "slug": "diffusion", "name": "diffusion", "has_file": false, "url": "concepts/diffusion.html"}, {"id": "concepts/image-gen", "type": "concept", "slug": "image-gen", "name": "image-gen", "has_file": false, "url": "concepts/image-gen.html"}, {"id": "concepts/pixel-space", "type": "concept", "slug": "pixel-space", "name": "pixel-space", "has_file": false, "url": "concepts/pixel-space.html"}, {"id": "concepts/transfer-learning", "type": "concept", "slug": "transfer-learning", "name": "transfer-learning", "has_file": false, "url": "concepts/transfer-learning.html"}, {"id": "concepts/flow-matching", "type": "concept", "slug": "flow-matching", "name": "Flow Matching", "has_file": true, "url": "concepts/flow-matching.html"}, {"id": "concepts/rl", "type": "concept", "slug": "rl", "name": "rl", "has_file": false, "url": "concepts/rl.html"}, {"id": "concepts/grpo", "type": "concept", "slug": "grpo", "name": "grpo", "has_file": false, "url": "concepts/grpo.html"}, {"id": "concepts/awm", "type": "concept", "slug": "awm", "name": "awm", "has_file": false, "url": "concepts/awm.html"}, {"id": "concepts/theory", "type": "concept", "slug": "theory", "name": "theory", "has_file": false, "url": "concepts/theory.html"}, {"id": "concepts/unified-multimodal", "type": "concept", "slug": "unified-multimodal", "name": "unified-multimodal", "has_file": false, "url": "concepts/unified-multimodal.html"}, {"id": "concepts/text-to-image", "type": "concept", "slug": "text-to-image", "name": "text-to-image", "has_file": false, "url": "concepts/text-to-image.html"}, {"id": "concepts/image-editing", "type": "concept", "slug": "image-editing", "name": "image-editing", "has_file": false, "url": "concepts/image-editing.html"}, {"id": "concepts/diffusion-transformer", "type": "concept", "slug": "diffusion-transformer", "name": "diffusion-tra <script>
(function () {
  const G = window.__GRAPH__;
  const colorByType = {
    paper: '#4A90E2', tutorial: '#8B5CF6',
    concept: '#F59E0B', repo: '#6B7280',
  };
  const shapeByType = {
    paper: 'ellipse', tutorial: 'round-rectangle',
    concept: 'diamond', repo: 'triangle',
  };

  const indeg = new Map();
  G.edges.forEach(e => indeg.set(e.to, (indeg.get(e.to) || 0) + 1));

  const elements = [
    ...G.nodes.map(n => ({
      data: {
        id: n.id, type: n.type, label: n.title || n.name || n.slug || n.id,
        url: n.url, raw: n,
        size: 16 + Math.min(28, (indeg.get(n.id) || 0) * 3),
      },
    })),
    ...G.edges.map((e, i) => ({ data: { id: 'e' + i, source: e.from, target: e.to, kind: e.kind } })),
  ];

  const cy = cytoscape({
    container: document.getElementById('cy'),
    elements,
    layout: { name: 'cose-bilkent', nodeRepulsion: 8000, idealEdgeLength: 120, animate: false },
    style: [
      { selector: 'node', style: {
        'background-color': ele => colorByType[ele.data('type')] || '#888',
        'shape': ele => shapeByType[ele.data('type')] || 'ellipse',
        'label': 'data(label)',
        'font-size': '11px',
        'text-valign': 'bottom', 'text-margin-y': 4,
        'text-wrap': 'ellipsis', 'text-max-width': 140,
        'width': 'data(size)', 'height': 'data(size)',
        'border-width': 1, 'border-color': '#333',
      } },
      { selector: 'edge', style: {
        'width': 1,
        'line-color': '#bbb',
        'curve-style': 'bezier',
        'target-arrow-shape': 'triangle',
        'target-arrow-color': '#bbb',
        'arrow-scale': 0.7,
      } },
      { selector: '.highlight', style: {
        'border-width': 3, 'border-color': '#dc3545',
      } },
    ],
  });

  cy.on('tap', 'node', evt => {
    const url = evt.target.data('url');
    if (url) window.location.href = url;
  });

  const tip = document.getElementById('graph-tooltip');
  cy.on('mouseover', 'node', evt => {
    const d = evt.target.data('raw');
    let html = '<h4>' + (d.title || d.name || d.slug || d.id) + '</h4>';
    if (d.tldr) html += '<p>' + (d.tldr.length > 240 ? d.tldr.slice(0, 240) + '…' : d.tldr) + '</p>';
    else if (d.type === 'repo') html += '<p>' + d.url + '</p>';
    else if (d.type === 'concept') {
      const cnt = G.edges.filter(e => e.to === d.id).length;
      html += '<p>' + cnt + ' 篇提到此概念</p>';
    }
    tip.innerHTML = html;
    tip.style.display = 'block';
  });
  cy.on('mousemove', 'node', evt => {
    tip.style.left = (evt.originalEvent.pageX + 12) + 'px';
    tip.style.top = (evt.originalEvent.pageY + 12) + 'px';
  });
  cy.on('mouseout', 'node', () => { tip.style.display = 'none'; });

  document.querySelectorAll('.graph-controls input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const t = cb.dataset.type;
      const sel = cy.nodes('[type = "' + t + '"]');
      if (cb.checked) sel.show(); else sel.hide();
    });
  });

  const search = document.getElementById('graph-search');
  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    cy.nodes().removeClass('highlight');
    if (!q) return;
    const matches = cy.nodes().filter(n => {
      const d = n.data('raw');
      return (d.title || '').toLowerCase().includes(q)
        || (d.slug || '').toLowerCase().includes(q)
        || (d.name || '').toLowerCase().includes(q);
    });
    matches.addClass('highlight');
    if (matches.length) cy.center(matches);
  });
})();
</script>
